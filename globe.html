<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Érettségi földgömb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#eef1ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Forgatható földgömb az érettségi topográfiai névanyagával: atlasz, domborzat és műholdkép, kereséssel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  color-scheme: light;
  --paper: #eef1ec; --card: #fbfcfa; --ink: #1b2622; --muted: #5a6862; --line: #d3dbd5;
  --accent: #1d6b57; --accent-ink: #ffffff; --accent-soft: #dcebe4;
  --sea: #c4dce5; --land: #f3eedd; --land-home: #ece0bb; --coast: #6d8f99; --border: #9a7f68; --county: #b59d7e;
  --river: #3a83b4; --lake: #b4d7e6; --grat: rgba(40,90,110,.16);
  --hit: #c8216b; --hit-fill: rgba(200,33,107,.26); --hov: #1d6b57; --hov-fill: rgba(29,107,87,.16);
  --faint: rgba(29,107,87,.10); --faint-line: rgba(29,107,87,.55); --dot: #1b2622; --dot-ring: #fbfcfa; --emelt: #b93a2a;
  --space-a: #e4ebe6; --space-b: #c9d6d0;
  --glass: rgba(251,252,250,.92); --shadow: 0 6px 24px rgba(20,40,34,.16);
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --f-body: 'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Arial, system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1615; --card: #172120; --ink: #e2ebe7; --muted: #95a6a0; --line: #2b3836;
  --accent: #4fbf9f; --accent-ink: #062019; --accent-soft: #163029;
  --sea: #10222a; --land: #252c26; --land-home: #313726; --coast: #4f7480; --border: #8c7a66; --county: #6a6150;
  --river: #5aa8d8; --lake: #1d3f4f; --grat: rgba(150,200,215,.10);
  --hit: #ff5aa0; --hit-fill: rgba(255,90,160,.28); --hov: #4fbf9f; --hov-fill: rgba(79,191,159,.18);
  --faint: rgba(79,191,159,.10); --faint-line: rgba(79,191,159,.55); --dot: #e2ebe7; --dot-ring: #10201c; --emelt: #ff8a73;
  --space-a: #121c1b; --space-b: #070c0c;
  --glass: rgba(23,33,32,.92); --shadow: 0 6px 24px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0f1615; --card: #172120; --ink: #e2ebe7; --muted: #95a6a0; --line: #2b3836;
  --accent: #4fbf9f; --accent-ink: #062019; --accent-soft: #163029;
  --sea: #10222a; --land: #252c26; --land-home: #313726; --coast: #4f7480; --border: #8c7a66; --county: #6a6150;
  --river: #5aa8d8; --lake: #1d3f4f; --grat: rgba(150,200,215,.10);
  --hit: #ff5aa0; --hit-fill: rgba(255,90,160,.28); --hov: #4fbf9f; --hov-fill: rgba(79,191,159,.18);
  --faint: rgba(79,191,159,.10); --faint-line: rgba(79,191,159,.55); --dot: #e2ebe7; --dot-ring: #10201c; --emelt: #ff8a73;
  --space-a: #121c1b; --space-b: #070c0c;
  --glass: rgba(23,33,32,.92); --shadow: 0 6px 24px rgba(0,0,0,.45); color-scheme: dark; }

html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; overscroll-behavior: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; background: var(--paper); color: var(--ink); font: 16px/1.45 var(--f-body); -webkit-text-size-adjust: 100%; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* maplibre – a szükséges minimum */
.maplibregl-map { overflow: hidden; position: relative; -webkit-tap-highlight-color: transparent; }
.maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: grab; }
.maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan, .maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: none; }
.maplibregl-marker { position: absolute; left: 0; top: 0; will-change: transform; transition: opacity .2s; }
.maplibregl-canvas-container.pointer { cursor: pointer; }

#map { position: fixed; inset: 0; background: radial-gradient(circle at 50% 46%, var(--space-a) 0%, var(--space-b) 78%); }

/* felső sáv */
.gbar { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
.gbar > * { pointer-events: auto; }
.back { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15px; }
.brand { display: grid; line-height: 1; }
.brand small { font: 500 9px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.brand b { font: 700 18px/1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.search { position: relative; flex: 1 1 auto; max-width: 460px; min-width: 0; }
.search input { width: 100%; box-sizing: border-box; height: 44px; padding: 0 40px 0 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); box-shadow: var(--shadow); font-size: 16px; }
.search input { -webkit-appearance: none; appearance: none; -webkit-user-select: text; user-select: text; }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
.search input::placeholder { color: var(--muted); }
.search .ico { position: absolute; left: 13px; top: 13px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search .clr { position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 20px; line-height: 1; }
.sr { position: absolute; left: 0; right: 0; top: 50px; margin: 0; padding: 6px; list-style: none; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); max-height: min(60vh, 420px); overflow: auto; }
.sr li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.sr li[aria-selected="true"], .sr li:hover { background: var(--accent-soft); }
.sr .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.sr .nm mark { background: none; color: var(--accent); }
.sr .mt { grid-column: 1; font-size: 12px; color: var(--muted); }
.sr .kd { grid-row: 1 / span 2; grid-column: 2; font: 500 10px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.sr .empty { display: block; color: var(--muted); cursor: default; }
.sr .empty:hover { background: none; }
.ebadge { font: 500 10px/1 var(--f-mono); color: var(--emelt); border: 1px solid currentColor; border-radius: 4px; padding: 2px 4px; }

/* módváltó */
.modes { position: fixed; z-index: 4; top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(10px, env(safe-area-inset-right, 0px));
  display: inline-flex; padding: 3px; gap: 3px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); }
.modes button { border: 0; background: none; border-radius: 9px; height: 36px; padding: 0 12px; font: 600 14px/1 var(--f-body); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.modes button svg { width: 16px; height: 16px; }
.modes button.on { background: var(--accent); color: var(--accent-ink); }

/* oldalpanel */
.panel { position: fixed; z-index: 3; left: max(10px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 64px); width: 300px; max-height: calc(100% - 64px - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 10px; padding: 12px; box-sizing: border-box; background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.prow { display: grid; gap: 6px; }
.plabel { font: 500 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 7px; padding: 7px 8px; font: 600 13px/1 var(--f-body); color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
select { width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); padding: 0 8px; font-size: 15px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; overflow: auto; min-height: 0; padding: 2px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 10px; font-size: 13px; line-height: 1.2; text-align: left; }
.chip.e { border-color: var(--emelt); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.count { font-size: 12px; color: var(--muted); }
.ptoggle { display: none; }

/* információs kártya */
.card { position: fixed; z-index: 6; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); width: 300px; box-sizing: border-box;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 14px 12px; display: grid; gap: 8px; }
.card .x { position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; border: 0; background: none; border-radius: 8px; color: var(--muted); font-size: 20px; line-height: 1; }
.card .eyebrow { font: 500 10px/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); padding-right: 30px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.card h2 { margin: 0; font: 700 28px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; text-wrap: balance; }
.card .full { margin: -2px 0 0; font-size: 13px; color: var(--muted); }
.card .also { display: grid; gap: 5px; }
.card .also > span { font: 500 10px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.card .also div { display: flex; flex-wrap: wrap; gap: 5px; }
.card .acts { display: flex; gap: 8px; }
.btn { border-radius: 10px; border: 1px solid var(--line); background: var(--paper); padding: 8px 12px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* nagyító */
.zoomctl { position: fixed; z-index: 3; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); display: grid; gap: 6px; }
.zoomctl button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); box-shadow: var(--shadow); font: 700 20px/1 var(--f-body); display: grid; place-items: center; }
.zoomctl button svg { width: 20px; height: 20px; }

/* címke a kijelölt helyhez */
.pin { display: grid; justify-items: center; pointer-events: none; }
.pin .tag { font: 700 15px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--paper); background: var(--ink); padding: 6px 9px 5px; border-radius: 6px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.25); max-width: 70vw; overflow: hidden; text-overflow: ellipsis; }
.pin .stem { width: 2px; height: 10px; background: var(--ink); }
.pin .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--hit); border: 2px solid #fff; box-shadow: 0 0 0 4px var(--hit-fill); animation: ping 1.8s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 var(--hit-fill); } 70% { box-shadow: 0 0 0 14px rgba(0,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }
.tip { position: fixed; z-index: 7; pointer-events: none; font: 600 13px/1.2 var(--f-body); background: var(--ink); color: var(--paper); padding: 5px 8px; border-radius: 6px; white-space: nowrap; transform: translate(14px, 14px); box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.tip i { font-style: normal; opacity: .7; font-weight: 400; }

.attrib { position: fixed; z-index: 2; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 4px); font-size: 11px; line-height: 1.3; color: var(--muted); background: var(--glass); padding: 2px 8px; border-radius: 6px; box-sizing: border-box; text-align: right; max-width: calc(100% - 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attrib a { color: inherit; }
.note { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 64px); max-width: min(520px, calc(100% - 24px)); box-sizing: border-box; padding: 8px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 13px; color: var(--muted); text-align: center; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; color: var(--muted); font-size: 15px; pointer-events: none; padding: 16px; text-align: center; }
#boot.err { color: #c62828; pointer-events: auto; }

@media (max-width: 1040px) { .brand { display: none; } }
@media (max-width: 760px) {
  .modes button, .chip, .seg button { min-height: 40px; }
  .gbar { flex-wrap: wrap; }
  .back { width: 44px; padding: 0; justify-content: center; }
  .back span { display: none; }
  .search { max-width: none; flex-basis: 0; }
  .modes { top: calc(env(safe-area-inset-top, 0px) + 62px); left: max(10px, env(safe-area-inset-left, 0px)); right: auto; }
  .modes button { padding: 0 10px; }
  .ptoggle { display: grid; position: fixed; z-index: 4; top: calc(env(safe-area-inset-top, 0px) + 62px); right: max(10px, env(safe-area-inset-right, 0px)); width: 44px; height: 44px; place-items: center; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); box-shadow: var(--shadow); }
  .ptoggle.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .ptoggle svg { width: 20px; height: 20px; }
  .panel { top: calc(env(safe-area-inset-top, 0px) + 114px); left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); width: auto; max-height: calc(100% - 114px - 90px - env(safe-area-inset-top, 0px)); }
  .panel:not(.open) { display: none; }
  .card { left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); width: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px); max-height: 46vh; overflow: auto; }
  .card h2 { font-size: 26px; }
  .zoomctl { bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); }
  .card:not([hidden]) ~ .zoomctl { display: none; }
  .note { top: calc(env(safe-area-inset-top, 0px) + 114px); }
}
@media (prefers-reduced-motion: reduce) { .pin .dot { animation: none; } }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Forgatható földgömb az érettségi topográfiai névanyagával"></div>
<div id="boot">Földgömb betöltése…</div>

<div class="gbar">
  <a class="back" href="index.html" title="Vissza a vaktérkép gyakorlóhoz"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span class="brand"><small>Vaktérkép</small><b>Gyakorló</b></span></a>
  <div class="search" role="combobox" aria-haspopup="listbox" aria-owns="sr" aria-expanded="false">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Keresés: hely, táj, folyó, város…" aria-label="Hely keresése" aria-autocomplete="list" aria-controls="sr">
    <button class="clr" id="qclr" type="button" aria-label="Keresés törlése" hidden>×</button>
    <ul class="sr" id="sr" role="listbox" hidden></ul>
  </div>
</div>

<div class="modes" role="group" aria-label="Térkép típusa">
  <button type="button" data-mode="atlas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Atlasz</button>
  <button type="button" data-mode="relief"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M2 19l7-11 4 6 3-4 6 9z"/></svg>Domborzat</button>
  <button type="button" data-mode="sat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>Műhold</button>
</div>
<button class="ptoggle" id="ptoggle" type="button" aria-label="Szűrők" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>

<aside class="panel" id="panel" aria-label="Szűrők">
  <div class="prow">
    <span class="plabel">Vizsgaszint</span>
    <div class="seg" role="group" aria-label="Vizsgaszint"><button type="button" id="lvl-k">Közép</button><button type="button" id="lvl-e">Közép + emelt</button></div>
  </div>
  <div class="prow">
    <label class="plabel" for="cat">Kategória</label>
    <select id="cat"></select>
  </div>
  <label class="chk"><input type="checkbox" id="showall"> Összes hely halvány jelölése</label>
  <div class="count" id="count"></div>
  <div class="chips" id="chips"></div>
</aside>

<section class="card" id="card" hidden aria-live="polite">
  <button class="x" id="cardx" type="button" aria-label="Bezárás">×</button>
  <div class="eyebrow" id="c-eye"></div>
  <h2 id="c-name"></h2>
  <p class="full" id="c-full" hidden></p>
  <div class="also" id="c-also" hidden><span>Ugyanitt még</span><div></div></div>
  <div class="acts"><button class="btn primary" id="c-fly" type="button">Ráközelít</button></div>
</section>

<div class="zoomctl">
  <button type="button" id="zin" aria-label="Nagyítás">+</button>
  <button type="button" id="zout" aria-label="Kicsinyítés">−</button>
  <button type="button" id="zhome" aria-label="Alaphelyzet: Magyarország"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></button>
</div>
<div class="note" id="note" hidden></div>
<div class="tip" id="tip" hidden></div>
<div class="attrib" id="attrib"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.js"></script>
<script>
// ISO2|ISO3|angol név|földrész (AF, EU, AS, NA, SA, OC, AN)
const COUNTRY_TABLE = `AF|AFG|Afghanistan|AS
AL|ALB|Albania|EU
DZ|DZA|Algeria|AF
AD|AND|Andorra|EU
AO|AGO|Angola|AF
AG|ATG|Antigua and Barbuda|NA
AR|ARG|Argentina|SA
AM|ARM|Armenia|AS
AU|AUS|Australia|OC
AT|AUT|Austria|EU
AZ|AZE|Azerbaijan|AS
BS|BHS|Bahamas|NA
BH|BHR|Bahrain|AS
BD|BGD|Bangladesh|AS
BB|BRB|Barbados|NA
BY|BLR|Belarus|EU
BE|BEL|Belgium|EU
BZ|BLZ|Belize|NA
BJ|BEN|Benin|AF
